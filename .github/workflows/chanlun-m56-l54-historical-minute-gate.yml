name: chanlun-m56-l54-historical-minute-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  public-chart-identity-vs-historical-data-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit chart-year hypothesis, provider claims and no raw data acquisition
        run: python -B tools/audit_chanlun_l54_2007_minute_candidate_m56.py
      - name: Verify OHLCVA path nonidentifiability and reject fake market certificates
        run: python -B -m unittest discover -s tests -p "test_chanlun_l54_2007_minute_candidate_m56.py" -v
      - name: M57 strict QMT native offline preflight
        run: python -B tools/probe_chanlun_l54_qmt_local_1m_m57.py --mode preflight
      - name: M57 native QMT fake-frame 28 regressions (no historical data)
        run: python -B -m unittest discover -s tests -p "test_probe_chanlun_l54_qmt_local_1m_m57.py" -v
      - name: M64 seven dated author reply receipts and third-point proof-boundary regressions
        run: python -B -m unittest discover -s tests -p "test_chanlun_l55_reply_chain_m64.py" -v
      - name: M65 L55 conditional pan departure/retrace proof-source state gate
        run: |
          python -B tools/audit_chanlun_l55_consolidation_depart_retrace_m65.py
          python -B -m unittest discover -s tests -p "test_chanlun_l55_consolidation_depart_retrace_m65.py" -v
      - name: M66 2007-07-11 correct host segment preview-vs-confirmation and F01 negative graph audit
        run: |
          python -B tools/audit_chanlun_july11_segment_confirmation_m66.py
          python -B -m unittest discover -s tests -p "test_chanlun_july11_segment_confirmation_m66.py" -v
      - name: M67 Apr03 author-pan-end level scope and no-circular-root-exit gate
        run: |
          python -B tools/audit_chanlun_confucius61_pan_end_root_cut_m67.py
          python -B -m unittest discover -s tests -p "test_chanlun_confucius61_pan_end_root_cut_m67.py" -v
      - name: M68 dual f1 bar-close-asof source and F01 anti-promotion gate
        run: |
          python -B tools/audit_chanlun_dual_f1_bar_close_asof_m68.py
          python -B -m unittest discover -s tests -p "test_chanlun_dual_f1_bar_close_asof_m68.py" -v
      - name: M69 native local QMT to in-memory M56 source admission and 240-grid fake tests
        run: |
          python -B tools/admit_chanlun_l54_local_qmt_m69.py --mode preflight
          python -B -m unittest discover -s tests -p "test_chanlun_l54_local_qmt_m69.py" -v
      - name: M70 native TDX 2006 2007 minute keys and local QMT time intersection source-only regressions
        run: |
          python -B tools/probe_chanlun_l54_tdx_qmt_clock_m70.py --mode preflight
          python -B -m unittest discover -s tests -p "test_chanlun_l54_tdx_qmt_clock_m70.py" -v
      - name: M72 external historical 1m RQData ARData one-day offline access gate and 26 fake regressions
        run: |
          python -B tools/probe_chanlun_l54_external_minute_m72.py --mode preflight
          python -B tools/probe_chanlun_l54_external_minute_m72.py --mode access-check
          python -B -m unittest discover -s tests -p "test_chanlun_l54_external_minute_m72.py" -v
      - name: M73 public archive and anonymous zzshare one-day source safety gate (30 fake fixtures)
        run: |
          python -B tools/probe_chanlun_l54_public_archive_m73.py --mode preflight
          python -B -m unittest discover -s tests -p "test_chanlun_l54_public_archive_m73.py" -v
      - name: M74 exact-hash public 2007 L54 minute replay: offline 240-bar synthetic regressions
        run: |
          python -B tools/replay_chanlun_l54_real_minute_m74.py --mode preflight
          python -B -m unittest discover -s tests -p "test_chanlun_l54_real_minute_m74.py" -v
      - name: M73 HF public repository directory prefix diagnostics (names and statuses only)
        if: github.event_name == 'pull_request' && github.head_ref == 'research/m73-github-public-minute-archive-2007-probe-20261115'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python -B - <<'PY'
          import json,urllib.request,urllib.parse,urllib.error
          base="https://huggingface.co/api/datasets/OxFengyuan/stock_dataset/tree/main"
          paths=["","A股分钟","A股分钟/2000-2024","A股分钟/2000-2024/2007","A股分钟/2000-2024/2007/1分钟"]
          for path in paths:
              url=base+("/"+urllib.parse.quote(path,safe="/") if path else "")+"?limit=12"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as f:
                      records=json.loads(f.read(75000))
                      names=[str(x.get("path","")) for x in records if isinstance(x,dict)]
                      print(json.dumps({"prefix":path or "repo-root","http_status":f.status,"items":len(records),"first_paths":names[:6]},ensure_ascii=False))
              except urllib.error.HTTPError as e:
                  print(json.dumps({"prefix":path or "repo-root","http_status":e.code,"items":0},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({"prefix":path or "repo-root","exception_class":type(e).__name__,"items":0},ensure_ascii=False))
          PY
      - name: M73 one-off public historical minute source discovery (no credentials, no saved bars)
        if: github.event_name == 'pull_request' && github.head_ref == 'research/m73-github-public-minute-archive-2007-probe-20261115'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          echo M73_HF_PUBLIC_ARCHIVE_ONCE_BEGIN
          python -B tools/probe_chanlun_l54_public_archive_m73.py --mode hf-once --candidate-date 2007-05-18 --timestamp-convention bar_end || true
          echo M73_ZZSHARE_ANONYMOUS_ONCE_BEGIN
          python -B tools/probe_chanlun_l54_public_archive_m73.py --mode zzshare-once --candidate-date 2007-05-18 --timestamp-convention bar_end || true
