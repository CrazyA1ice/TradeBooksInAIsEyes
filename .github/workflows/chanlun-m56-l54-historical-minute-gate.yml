name: chanlun-m56-l54-historical-minute-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  public-chart-identity-vs-historical-data-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit chart-year hypothesis, provider claims and no raw data acquisition
        run: python -B tools/audit_chanlun_l54_2007_minute_candidate_m56.py
      - name: Verify OHLCVA path nonidentifiability and reject fake market certificates
        run: python -B -m unittest discover -s tests -p "test_chanlun_l54_2007_minute_candidate_m56.py" -v
      - name: M57 strict QMT native offline preflight
        run: python -B tools/probe_chanlun_l54_qmt_local_1m_m57.py --mode preflight
      - name: M57 native QMT fake-frame 28 regressions (no historical data)
        run: python -B -m unittest discover -s tests -p "test_probe_chanlun_l54_qmt_local_1m_m57.py" -v
      - name: M64 seven dated author reply receipts and third-point proof-boundary regressions
        run: python -B -m unittest discover -s tests -p "test_chanlun_l55_reply_chain_m64.py" -v
      - name: M65 L55 conditional pan departure/retrace proof-source state gate
        run: |
          python -B tools/audit_chanlun_l55_consolidation_depart_retrace_m65.py
          python -B -m unittest discover -s tests -p "test_chanlun_l55_consolidation_depart_retrace_m65.py" -v
      - name: M66 2007-07-11 correct host segment preview-vs-confirmation and F01 negative graph audit
        run: |
          python -B tools/audit_chanlun_july11_segment_confirmation_m66.py
          python -B -m unittest discover -s tests -p "test_chanlun_july11_segment_confirmation_m66.py" -v
      - name: M67 Apr03 author-pan-end level scope and no-circular-root-exit gate
        run: |
          python -B tools/audit_chanlun_confucius61_pan_end_root_cut_m67.py
          python -B -m unittest discover -s tests -p "test_chanlun_confucius61_pan_end_root_cut_m67.py" -v
