name: Chanlun priority original PDF figure render (temporary evidence only)
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/render_chanlun_priority_original_pages.py"
      - ".github/workflows/chanlun-priority-original-figure-render.yml"
      - "deliverables/chanlun_108_acceptance/04_AI_GUIDE/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-figure-render:
    name: Verify five-volume inventory and render selected source pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed PyMuPDF PDF rendering dependency
        run: python -m pip install "PyMuPDF==1.26.7"
      - name: Verify immutable PDF SHA and render original priority physical pages
        shell: bash
        run: python -B tools/render_chanlun_priority_original_pages.py --out "$RUNNER_TEMP/chanlun-priority-source-figure-review" --full-dpi 185 --crop-dpi 300
      - name: Upload only temporary original-source visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: chanlun-priority-source-figure-evidence
          path: ${{ runner.temp }}/chanlun-priority-source-figure-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 2
