name: Temporary read-only source inspection lessons 2-5
on:
  push:
    branches: [feat/chanlun-lessons-002-005-deep-reading-20261107]
    paths:
      - ".github/workflows/tmp-lessons-002-005-source.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned native PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Read lesson 2 through lesson 5 without editing PDFs
        run: |
          for n in 2 3 4 5; do
            python -B tools/read_chanlun_lesson_readonly.py --lesson "$n" --emit-text
          done
      - name: Install Chinese OCR for figure quality check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr-chi-sim
      - name: Check lesson-4 illustration geometry and OCR, never trust numeric readings
        run: python -B tools/scan_chanlun_early_figures.py
