name: Temporary SHA-locked cross-volume source survey lessons 21–25
on:
  push:
    branches: [feat/chanlun-lessons021-025-crossvolume-20261107]
    paths: ["tools/survey_chanlun_lessons021_025.py", ".github/workflows/tmp-survey-lessons021-025.yml"]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons021_025.py
