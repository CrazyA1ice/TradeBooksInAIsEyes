name: Temporary source read for Chanlun lessons 31-35
on:
  push:
    branches: [feat/chanlun-lessons031-035-source-20261107]
    paths:
      - "tools/survey_chanlun_lessons031_035.py"
      - ".github/workflows/tmp-source-lessons031-035.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons031_035.py
