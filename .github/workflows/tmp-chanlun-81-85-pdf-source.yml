name: Temporary Chanlun 81–85 original PDF survey
on:
  push:
    branches: [feat/chanlun-lessons081-085-source-and-version-20261108]
    paths: [".github/workflows/tmp-chanlun-81-85-pdf-source.yml","tools/survey_chanlun_lessons081_085.py"]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons081_085.py
