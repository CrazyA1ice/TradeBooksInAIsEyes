name: Temporary original PDF source read lessons 51–55
on:
  push:
    branches: [feat/chanlun-lessons051-055-deep-reading-20261107]
    paths:
      - "tools/survey_chanlun_lessons051_055.py"
      - ".github/workflows/tmp-source-chanlun-lessons051-055.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons051_055.py
