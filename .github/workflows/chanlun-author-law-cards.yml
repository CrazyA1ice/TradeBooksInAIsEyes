name: Chanlun author-law cards provenance and graph
on:
  pull_request:
    paths:
      - 'catalog/chanlun_author_law_cards_v1.json'
      - 'catalog/chanlun_four_core_contrasts_v1.json'
      - 'catalog/chanlun_claim_modality_v1.json'
      - 'catalog/chanlun_strong_theses_proof_map_v1.json'
      - 'catalog/chanlun_recursive_construction_proof_chain_v1.json'
      - 'catalog/chanlun_g01_g05_conditional_witnesses_v1.json'
      - 'catalog/chanlun_g01_g05_typed_rule_contract_v1.json'
      - 'catalog/chanlun_author_law_argument_bridges_v1.json'
      - 'tools/audit_chanlun_author_law_cards.py'
      - 'tools/audit_chanlun_four_core_contrasts.py'
      - 'tools/audit_chanlun_claim_modality.py'
      - 'tools/audit_chanlun_strong_theses.py'
      - 'tools/audit_chanlun_recursive_proof_chain.py'
      - 'tools/audit_chanlun_g01_g05_witnesses.py'
      - 'tools/audit_chanlun_g01_g05_typed_rule_contract.py'
      - 'tools/audit_chanlun_law_argument_bridges.py'
      - 'tests/test_chanlun_author_law_cards.py'
      - 'tests/test_chanlun_four_core_contrasts.py'
      - 'tests/test_chanlun_claim_modality.py'
      - 'tests/test_chanlun_strong_theses.py'
      - 'tests/test_chanlun_recursive_proof_chain.py'
      - 'tests/test_chanlun_g01_g05_witnesses.py'
      - 'tests/test_chanlun_g01_g05_typed_rule_contract.py'
      - 'tests/test_chanlun_law_argument_bridges.py'
      - '.github/workflows/chanlun-author-law-cards.yml'
      - 'ChanlunCollection/**'
  workflow_dispatch:
jobs:
  author-law-card-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate linked cards against the real source files
        run: python -B tools/audit_chanlun_author_law_cards.py
      - name: Validate cross-card bridges and evidence identities
        run: python -B tools/audit_chanlun_law_argument_bridges.py
      - name: Fail-closed card unit tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_author_law_cards.py' -v
      - name: Fail-closed argument-bridge tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_law_argument_bridges.py' -v
      - name: Audit four core source contrasts
        run: python -B tools/audit_chanlun_four_core_contrasts.py
      - name: Four core source contrast regression tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_four_core_contrasts.py' -v
      - name: Audit source-claim logical modality boundaries
        run: python -B tools/audit_chanlun_claim_modality.py
      - name: Source-claim modality negative regression tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_claim_modality.py' -v
      - name: Check strong thesis scope and source proof obligations
        run: python -B tools/audit_chanlun_strong_theses.py
      - name: Strong thesis fail-closed regression tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_strong_theses.py' -v
      - name: Audit recursive construction proof steps and open gates
        run: python -B tools/audit_chanlun_recursive_proof_chain.py
      - name: Recursive construction fail-closed tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_recursive_proof_chain.py' -v
      - name: Validate G01/G05 conditional witnesses and source cues
        run: python -B tools/audit_chanlun_g01_g05_witnesses.py
      - name: G01/G05 assumption and non-entailment regression tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_g01_g05_witnesses.py' -v
      - name: Audit typed G01/G05 rule gate and normalization contract
        run: python -B tools/audit_chanlun_g01_g05_typed_rule_contract.py
      - name: Fail-closed typed rule contract unit tests
        run: python -B -m unittest discover -s tests -p 'test_chanlun_g01_g05_typed_rule_contract.py' -v

