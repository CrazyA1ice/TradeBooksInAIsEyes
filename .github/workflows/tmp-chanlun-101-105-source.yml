name: Temporary Chanlun 101–105 original PDF read-only source survey
on:
  push:
    branches: [feat/chanlun-lessons101-105-source-audit-20261108]
    paths: [".github/workflows/tmp-chanlun-101-105-source.yml","tools/survey_chanlun_lessons101_105.py"]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons101_105.py
