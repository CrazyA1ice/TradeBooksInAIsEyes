name: Chanlun 106-108 source, provenance and synthetic boundary audits
on:
  push:
    branches: [feat/chanlun-lessons106-108-source-audit-20261108]
    paths:
      - ".github/workflows/chanlun-lessons106-108-audit.yml"
      - "catalog/chanlun_lessons106_108_source_layers.json"
      - "tools/survey_chanlun_lessons106_108.py"
      - "tools/verify_chanlun_lessons106_108.py"
      - "tools/audit_chanlun_lessons106_108.py"
      - "tests/test_chanlun_lessons106_108*.py"
      - "knowledge/evidence/chanlun_lesson10*.json"
      - "knowledge/claims/chanlun_lessons106_108_semantic_dependencies.json"
      - "analyses/books/chanlun/chapters/lesson_10*.md"
      - "analyses/books/chanlun/volumes/LESSONS_106_108_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons106_108.py
      - run: python -B tools/audit_chanlun_lessons106_108.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons106_108.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons106_108_audits.py" -v
