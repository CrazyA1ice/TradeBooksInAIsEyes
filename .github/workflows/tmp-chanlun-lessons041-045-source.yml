name: Temporary source survey Chanlun lessons 41–45 two volumes
on:
  push:
    branches: [feat/chanlun-lessons041-045-crossvolume-20261107]
    paths:
      - "tools/survey_chanlun_lessons041_045.py"
      - ".github/workflows/tmp-chanlun-lessons041-045-source.yml"
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons041_045.py
