name: Temporary Chanlun 96–100 original PDF survey
on:
  push:
    branches: [feat/chanlun-lessons096-100-structure-behavior-20261108]
    paths: [".github/workflows/tmp-chanlun-096-100-source.yml","tools/survey_chanlun_lessons096_100.py"]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons096_100.py
