name: chanlun-expert-history-two-methods-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  historical-source-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -B tools/audit_chanlun_expert_history_two_methods.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_expert_history_two_methods.py" -v
