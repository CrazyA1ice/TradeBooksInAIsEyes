name: Temporary SHA-locked source read for lessons 36-40
on:
  push:
    branches: [feat/chanlun-lessons036-040-research-20261107]
    paths:
      - ".github/workflows/tmp-source-chanlun-036-040.yml"
      - "tools/survey_chanlun_lessons036_040.py"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons036_040.py
