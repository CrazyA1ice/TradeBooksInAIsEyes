name: First lesson source reading (temporary)
on:
  push:
    branches:
      - feat/phase1-lesson1-analysis-20261107
    paths:
      - ".github/workflows/phase1-lesson1-source-read.yml"
      - "tools/read_chanlun_lesson_readonly.py"

permissions:
  contents: read
jobs:
  source-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Read original first-lesson source without modifying PDF
        run: python -B tools/read_chanlun_lesson_readonly.py --lesson 1 --emit-text
