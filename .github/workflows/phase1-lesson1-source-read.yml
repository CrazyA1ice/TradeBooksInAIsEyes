name: First lesson source reading (temporary)
on:
  push:
    branches:
      - feat/phase1-lesson1-analysis-20261107
    paths:
      - ".github/workflows/phase1-lesson1-source-read.yml"
      - "tools/read_chanlun_lesson_readonly.py"
      - "tools/ocr_chanlun_lesson1_page4.py"

permissions:
  contents: read
jobs:
  source-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Read source lesson boundary without repeating full original text
        run: python -B tools/read_chanlun_lesson_readonly.py --lesson 1
      - name: Install Chinese OCR language pack
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr-chi-sim
      - name: Inspect and OCR image-heavy page 4
        run: python -B tools/ocr_chanlun_lesson1_page4.py
