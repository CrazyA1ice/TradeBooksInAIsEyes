name: Temporary source survey lessons 16–20
on:
  push:
    branches: [feat/chanlun-lessons016-020-research-20261107]
    paths:
      - ".github/workflows/tmp-chanlun-lessons016-020-survey.yml"
      - "tools/survey_chanlun_lessons016_020.py"
permissions:
  contents: read
jobs:
  source-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons016_020.py
