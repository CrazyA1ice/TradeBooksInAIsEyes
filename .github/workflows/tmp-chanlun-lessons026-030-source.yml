name: Temporary original PDF source survey lessons 26-30
on:
  push:
    branches: [feat/chanlun-lessons026-030-research-20261107]
    paths: ["tools/survey_chanlun_lessons026_030.py", ".github/workflows/tmp-chanlun-lessons026-030-source.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons026_030.py
