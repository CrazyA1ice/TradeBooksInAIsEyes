name: Chanlun original bridge pages 39-98-100 native text audit
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_chanlun_bridge_text_readonly.py"
      - "tests/test_chanlun_bridge_text_audit.py"
      - "reports/source_inventory/chanlun_bridge_native_text_sha256.json"
      - "deliverables/chanlun_108_acceptance/04_AI_GUIDE/17_*"
      - ".github/workflows/chanlun-bridge-native-text.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-bridge-text:
    name: Original PDF SHA and bounded native text only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin exact native PDF text extractor without image/OCR
        run: python -m pip install "PyMuPDF==1.26.7"
      - name: Source audit regression before reading PDF
        run: python -B -m unittest discover -s tests -p "test_chanlun_bridge_text_audit.py" -v
      - name: Discover original physical-page fingerprints (temporary until pinned)
        run: python -B tools/inspect_chanlun_bridge_text_readonly.py --discovery-only
