name: Chanlun F01 source-figure temporary visual readback (PDF SHA pinned)
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_chanlun_f01_original_figures_readonly.py"
      - "deliverables/chanlun_108_acceptance/00_REVIEW/WHOLE_BOOK_F01_FIGURE_EVIDENCE_67_71_78.md"
      - ".github/workflows/chanlun-f01-figure-readback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-original-source-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF native renderer
        run: python -m pip install pymupdf==1.26.7
      - name: Render limited PDF figure pages transiently from SHA-pinned originals
        run: python -B tools/inspect_chanlun_f01_original_figures_readonly.py --emit-pages
