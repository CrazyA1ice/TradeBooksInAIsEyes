name: Chanlun v4 market revision time and pen proof obligations
on:
  push:
    branches: [feat/chanlun-revision-provenance-pen-certification-gates-v4-20261108]
    paths:
      - ".github/workflows/chanlun-revision-proof-v4-audit.yml"
      - "tools/chanlun_revision_proof_gates_v4.py"
      - "tools/audit_chanlun_revision_causal_witness_v4.py"
      - "tests/test_chanlun_revision_proof_gates_v4.py"
      - "tools/chanlun_pen_frontier_v3.py"
      - "tools/chanlun_incremental_events_v2.py"
      - "tools/chanlun_event_lab_v1.py"
      - "experiments/fixtures/chanlun_pen_frontier_synthetic_v3.json"
      - "catalog/chanlun_rule_history_v1.json"
      - "docs/CHANLUN_REVISION_PROOF_GATES_V4.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  revision-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -B -m unittest discover -s tests -p "test_chanlun_revision_proof_gates_v4.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_pen_frontier_v3.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_incremental_events_v2.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_event_lab_v1.py" -v
      - run: python -B tools/chanlun_revision_proof_gates_v4.py --asof "2007-09-20T01:40:50+00:00"
      - run: python -B tools/chanlun_revision_proof_gates_v4.py --asof "2007-09-20T01:41:01+00:00"
      - run: python -B tools/chanlun_revision_proof_gates_v4.py --asof "2007-09-20T02:00:00+00:00" --rule pen_081_later_dated_post
      - run: python -B tools/audit_chanlun_revision_causal_witness_v4.py
      - run: python -B tools/audit_chanlun_unified_knowledge.py --verify
