name: Temporary source survey Chanlun 66–70 (cross volume)
on:
  push:
    branches: [feat/chanlun-lessons066-070-crossvolume-20261107]
    paths:
      - ".github/workflows/tmp-chanlun-66-70-source.yml"
      - "tools/survey_chanlun_lessons066_070.py"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons066_070.py
