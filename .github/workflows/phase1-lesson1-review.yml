name: Phase 1 lesson-1 evidence audit

on:
  push:
    branches:
      - feat/phase1-lesson1-analysis-20261107
    paths:
      - "tools/verify_chanlun_lesson1_analysis.py"
      - "tests/test_chanlun_lesson1_audit.py"
      - "knowledge/evidence/chanlun_lesson001.json"
      - "analyses/books/chanlun/chapters/lesson_001.md"
      - ".github/workflows/phase1-lesson1-review.yml"
  pull_request:
    branches:
      - main
    paths:
      - "knowledge/evidence/chanlun_lesson001.json"
      - "analyses/books/chanlun/chapters/lesson_001.md"
      - "tools/verify_chanlun_lesson1_analysis.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit source SHA, evidence, claims and seven-layer report
        run: python -B tools/verify_chanlun_lesson1_analysis.py
      - name: Run negative and positive audit tests
        run: python -B -m unittest discover -s tests -p "test_chanlun_lesson1_audit.py" -v
