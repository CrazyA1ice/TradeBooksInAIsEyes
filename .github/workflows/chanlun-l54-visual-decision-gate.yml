name: chanlun-l54-visual-decision-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit-lesson54-figure-and-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify archive figure evidence role, structural labels and bounded decision claims
        run: python -B tools/verify_chanlun_l54_visual_record.py
      - name: Exercise seven positive/negative regression tests
        run: python -B -m unittest discover -s tests -p "test_chanlun_l54_visual_record.py" -v
