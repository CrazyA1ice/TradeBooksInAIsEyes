name: Temporary Chanlun 91–95 original fifth-volume source review
on:
  push:
    branches: [feat/chanlun-lessons091-095-structure-duality-20261108]
    paths: [".github/workflows/tmp-chanlun-091-095-source.yml","tools/survey_chanlun_lessons091_095.py"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons091_095.py
