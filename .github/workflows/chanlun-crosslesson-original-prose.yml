name: Chanlun cross-lesson original native text and proof-scope audit
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_chanlun_crosslesson_proof_text_readonly.py"
      - "tests/test_chanlun_crosslesson_proof_text.py"
      - "reports/source_inventory/chanlun_crosslesson_proof_native_text_sha256.json"
      - "deliverables/chanlun_108_acceptance/04_AI_GUIDE/18_*"
      - ".github/workflows/chanlun-crosslesson-original-prose.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-crosslesson-native-prose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned original PDF native reader
        run: python -m pip install "PyMuPDF==1.26.7"
      - name: Test exact scope and bounded excerpts
        run: python -B -m unittest discover -s tests -p "test_chanlun_crosslesson_proof_text.py" -v
      - name: Discover previously unpinned physical-page text, no proof claims
        run: python -B tools/inspect_chanlun_crosslesson_proof_text_readonly.py --discover
