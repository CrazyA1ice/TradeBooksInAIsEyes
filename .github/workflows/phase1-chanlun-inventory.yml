name: Phase 1 Chanlun PDF read-only inventory

on:
  push:
    branches:
      - feat/phase1-chanlun-pdf-intake-20261107
    paths:
      - "tools/inspect_chanlun_sources.py"
      - "tests/test_chanlun_inventory.py"
      - ".github/workflows/phase1-chanlun-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Check synthetic fixtures
        run: python -m unittest discover -s tests -p "test_chanlun_inventory.py" -v
      - name: Survey existing PDFs without OCR or source modification
        run: python -B tools/inspect_chanlun_sources.py --out reports/source_inventory/chanlun_inventory.json
      - name: Verify inventory has five expected volumes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('reports/source_inventory/chanlun_inventory.json').read_text(encoding='utf-8'))
          assert len(data['volumes']) == 5
          assert all(x['page_count'] > 0 and x['bytes'] > 0 for x in data['volumes'])
          print('PASS: five source PDFs inspected; no source files changed')
          PY
      - name: Retain machine-readable private-run inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: chanlun-phase1-source-inventory
          path: reports/source_inventory/chanlun_inventory.json
          retention-days: 30
