name: Temporary Chanlun 86–90 volumes4–5 PDF read-only survey
on:
  push:
    branches: [feat/chanlun-lessons086-090-crossvolume-20261108]
    paths: [".github/workflows/tmp-chanlun-086-090-pdf-source.yml","tools/survey_chanlun_lessons086_090.py"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons086_090.py
