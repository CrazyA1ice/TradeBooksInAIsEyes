name: Temporary original PDF text and figure thumbnails 56–60
on:
  push:
    branches: [feat/chanlun-lessons056-060-figure-audit-20261107]
    paths: [".github/workflows/tmp-chanlun-lessons056-060-source.yml", "tools/survey_chanlun_lessons056_060.py"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow
      - run: python -B tools/survey_chanlun_lessons056_060.py
