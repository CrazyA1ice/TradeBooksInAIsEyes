name: Chanlun 108 lesson acceptance bundle - audit only
on:
  push:
    branches: [feat/chanlun-108-research-final-acceptance-bundle-20261108]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    name: All five PDFs, 108 analyses, 110 hypotheses and 36 examples
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all copied book deliverables and future-case source links
        run: python -B deliverables/chanlun_108_acceptance/00_REVIEW/audit_acceptance.py
      - name: Upload one-folder book acceptance bundle as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chanlun-108-acceptance-bundle
          path: deliverables/chanlun_108_acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
