name: Chanlun 108 canonical-source acceptance and temporary offline ZIP
on:
  push:
    branches:
      - main
      - refactor/deduplicate-chanlun-acceptance-and-reusable-book-workflow-20261108
    paths:
      - "deliverables/chanlun_108_acceptance/**"
      - "ChineseBooks/缠论/**"
      - "analyses/books/chanlun/**"
      - "knowledge/**"
      - "catalog/**"
      - "docs/BOOK_RESEARCH_WORKFLOW.md"
      - "tools/build_book_acceptance_zip.py"
      - "tools/audit_book_ai_guide.py"
      - ".github/workflows/chanlun-108-acceptance-bundle.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    name: Five PDFs, 108 chapters, 110 formal hypotheses and deduplication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit original PDF SHA and unique canonical sources
        run: python -B deliverables/chanlun_108_acceptance/00_REVIEW/audit_acceptance.py
      - name: Audit mandatory source-linked, illustrated AI deep reading guide
        run: python -B tools/audit_book_ai_guide.py --book-slug chanlun --acceptance-dir deliverables/chanlun_108_acceptance
      - name: Assemble offline materials from canonical originals in runner temp
        shell: bash
        run: python -B tools/build_book_acceptance_zip.py --spec deliverables/chanlun_108_acceptance/OFFLINE_PACKAGE_SPEC.json --out "$RUNNER_TEMP/Chanlun-108-clean-offline.zip"
      - name: Upload temporary offline ZIP without copying files into git
        uses: actions/upload-artifact@v4
        with:
          name: Chanlun-108-clean-offline
          path: ${{ runner.temp }}/Chanlun-108-clean-offline.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
