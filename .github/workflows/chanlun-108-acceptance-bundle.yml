name: Chanlun 108 canonical-source acceptance and temporary offline ZIP
on:
  push:
    branches:
      - main
      - refactor/deduplicate-chanlun-acceptance-and-reusable-book-workflow-20261108
    paths:
      - "deliverables/chanlun_108_acceptance/**"
      - "ChineseBooks/缠论/**"
      - "analyses/books/chanlun/**"
      - "knowledge/**"
      - "catalog/**"
      - "docs/BOOK_RESEARCH_WORKFLOW.md"
      - "tools/build_book_acceptance_zip.py"
      - "tools/audit_book_ai_guide.py"
      - "tests/test_chanlun_asof_player.mjs"
      - "tests/test_chanlun_source_case_atlas.py"
      - "tests/test_chanlun_original_figure_review.py"
      - "tests/test_chanlun_figure_lineage.py"
      - "tests/test_chanlun_native_raster_ceiling.py"
      - "tests/test_chanlun_text_logic_audit.py"
      - "tools/audit_chanlun_native_figure_resolution.py"
      - ".github/workflows/chanlun-108-acceptance-bundle.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    name: Five PDFs, 108 chapters, 110 formal hypotheses and deduplication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit original PDF SHA and unique canonical sources
        run: python -B deliverables/chanlun_108_acceptance/00_REVIEW/audit_acceptance.py
      - name: Audit mandatory source-linked, illustrated AI deep reading guide
        run: python -B tools/audit_book_ai_guide.py --book-slug chanlun --acceptance-dir deliverables/chanlun_108_acceptance --require-tutorial 05_专题教程_走势分解与终完美.md --require-tutorial 06_专题教程_中枢背驰与三类点.md --require-tutorial 07_专题教程_从分型到线段中枢.md --require-source-case 09_原书关键案例与定理证据对照.md --min-source-cases 9
      - name: Cross-check nine real source case discussions against canonical text evidence
        run: python -B -m unittest discover -s tests -p 'test_chanlun_source_case_atlas.py' -v
      - name: Regression-check original PDF figure observations, source dates and manifest
        run: python -B -m unittest discover -s tests -p 'test_chanlun_original_figure_review.py' -v
      - name: Verify 7-8-9 figure-source lineage and postdated pen-rule boundaries
        run: python -B -m unittest discover -s tests -p 'test_chanlun_figure_lineage.py' -v
      - name: Verify native PDF image resolution is not mistaken for a verified price pixel
        run: python -B -m unittest discover -s tests -p 'test_chanlun_native_raster_ceiling.py' -v
      - name: Validate source-text-first reasoning and manual-only figure review
        run: python -B -m unittest discover -s tests -p 'test_chanlun_text_logic_audit.py' -v
      - name: Verify as-of-only visualization and matched-future branches (offline Node)
        run: node tests/test_chanlun_asof_player.mjs
      - name: Assemble offline materials from canonical originals in runner temp
        shell: bash
        run: python -B tools/build_book_acceptance_zip.py --spec deliverables/chanlun_108_acceptance/OFFLINE_PACKAGE_SPEC.json --out "$RUNNER_TEMP/Chanlun-108-clean-offline.zip"
      - name: Upload temporary offline ZIP without copying files into git
        uses: actions/upload-artifact@v4
        with:
          name: Chanlun-108-clean-offline
          path: ${{ runner.temp }}/Chanlun-108-clean-offline.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
