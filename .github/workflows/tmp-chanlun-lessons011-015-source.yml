name: Temporary source inspection Chanlun lessons 11–15
on:
  push:
    branches: [feat/chanlun-lessons011-015-research-20261107]
    paths:
      - "tools/survey_chanlun_lessons011_015.py"
      - ".github/workflows/tmp-chanlun-lessons011-015-source.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/survey_chanlun_lessons011_015.py
