name: Chanlun 11–15 source and early-definition audit
on:
  push:
    branches: [feat/chanlun-lessons011-015-research-20261107]
    paths:
      - ".github/workflows/chanlun-lessons011-015-audit.yml"
      - "catalog/chanlun_lessons011_015_source_layers.json"
      - "tools/verify_chanlun_lessons011_015.py"
      - "tools/audit_chanlun_lesson015_early_classification.py"
      - "tests/test_chanlun_lessons011_015.py"
      - "tests/test_chanlun_lesson015_classification.py"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_011_015_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all five research articles against original PDF sha and page ranges
        run: python -B tools/verify_chanlun_lessons011_015.py
      - name: Demonstrate early high-low edge-case classifier
        run: python -B tools/audit_chanlun_lesson015_early_classification.py
      - name: Audit positive and negative evidence fixtures
        run: python -B -m unittest discover -s tests -p "test_chanlun_lessons011_015.py" -v
      - name: Audit equality edges and pivot-confirmation time
        run: python -B -m unittest discover -s tests -p "test_chanlun_lesson015_classification.py" -v
