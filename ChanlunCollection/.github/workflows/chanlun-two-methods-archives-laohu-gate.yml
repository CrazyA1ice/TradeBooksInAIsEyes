name: chanlun-two-methods-archives-laohu-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  trace-original-and-archived-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -B tools/audit_chanlun_two_methods_archives_laohu.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_two_methods_archives_laohu.py" -v
