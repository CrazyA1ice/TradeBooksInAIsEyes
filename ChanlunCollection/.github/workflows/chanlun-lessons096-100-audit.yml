name: Chanlun 96–100 original source, branch disagreement and conditional audits
on:
  push:
    branches: [feat/chanlun-lessons096-100-structure-behavior-20261108]
    paths:
      - ".github/workflows/chanlun-lessons096-100-audit.yml"
      - "catalog/chanlun_lessons096_100_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons096_100_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons096_100.py"
      - "tools/audit_chanlun_lesson096_behavioral_gate.py"
      - "tools/audit_chanlun_lessons097_098_evidence_gate.py"
      - "tools/audit_chanlun_lesson099_resegmentation.py"
      - "tools/audit_chanlun_lesson100_branch_dispute.py"
      - "tests/test_chanlun_lessons096_100.py"
      - "tests/test_chanlun_lesson096_behavioral_gate.py"
      - "tests/test_chanlun_lessons097_098_evidence_gate.py"
      - "tests/test_chanlun_lesson099_resegmentation.py"
      - "tests/test_chanlun_lesson100_branch_dispute.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_096_100_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons096_100.py
      - run: python -B tools/audit_chanlun_lesson096_behavioral_gate.py
      - run: python -B tools/audit_chanlun_lessons097_098_evidence_gate.py
      - run: python -B tools/audit_chanlun_lesson099_resegmentation.py
      - run: python -B tools/audit_chanlun_lesson100_branch_dispute.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons096_100.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson096_behavioral_gate.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons097_098_evidence_gate.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson099_resegmentation.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson100_branch_dispute.py" -v
