name: Audit Chanlun lessons 36–40 and branch/inventory boundaries
on:
  push:
    branches: [feat/chanlun-lessons036-040-research-20261107]
    paths:
      - ".github/workflows/chanlun-lessons036-040-audit.yml"
      - "tools/verify_chanlun_lessons036_040.py"
      - "catalog/chanlun_lessons036_040_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_early_core_dependencies.json"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_036_040_SYNTHESIS.md"
      - "tools/audit_chanlun_lesson039_branches.py"
      - "tools/audit_chanlun_lesson040_inventory.py"
      - "tests/test_chanlun_lessons036_040.py"
      - "tests/test_chanlun_lesson039_branches.py"
      - "tests/test_chanlun_lesson040_inventory.py"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -B tools/verify_chanlun_lessons036_040.py
      - run: python -B tools/audit_chanlun_lesson039_branches.py
      - run: python -B tools/audit_chanlun_lesson040_inventory.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons036_040.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson039_branches.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson040_inventory.py" -v
