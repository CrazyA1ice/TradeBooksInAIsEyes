name: Chanlun original-PDF theorem text excerpts (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/inspect_chanlun_original_proof_text_readonly.py"
      - ".github/workflows/chanlun-original-theorem-text-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-native-prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned native PDF text reader (NO image render/OCR)
        run: python -m pip install "PyMuPDF==1.26.7"
      - name: Hash-check original PDFs and inspect bounded exact argument text
        run: python -B tools/inspect_chanlun_original_proof_text_readonly.py
