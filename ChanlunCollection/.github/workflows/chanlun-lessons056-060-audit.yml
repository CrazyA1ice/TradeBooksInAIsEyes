name: Chanlun lessons 56–60 source, visual scope and price-precision checks
on:
  push:
    branches: [feat/chanlun-lessons056-060-figure-audit-20261107]
    paths:
      - ".github/workflows/chanlun-lessons056-060-audit.yml"
      - "catalog/chanlun_lessons056_060_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_early_core_dependencies.json"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_056_060_SYNTHESIS.md"
      - "tools/verify_chanlun_lessons056_060.py"
      - "tools/audit_chanlun_056_058_timing.py"
      - "tools/audit_chanlun_lesson059_precision.py"
      - "tests/test_chanlun_lessons056_060.py"
      - "tests/test_chanlun_056_058_timing.py"
      - "tests/test_chanlun_lesson059_precision.py"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -B tools/verify_chanlun_lessons056_060.py
      - run: python -B tools/audit_chanlun_056_058_timing.py
      - run: python -B tools/audit_chanlun_lesson059_precision.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons056_060.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_056_058_timing.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson059_precision.py" -v
