name: Chanlun primitive price-run lifecycle and no-false-center audit
on:
  pull_request:
    branches: [main]
    paths:
      - "catalog/chanlun_primitive_run_lifecycle_v1.json"
      - "tools/audit_chanlun_primitive_run_lifecycle.py"
      - "tests/fixtures/chanlun_primitive_run_lifecycle_cases_v1.json"
      - "tests/test_chanlun_primitive_run_lifecycle.py"
      - "deliverables/chanlun_108_acceptance/04_AI_GUIDE/26_*"
      - ".github/workflows/chanlun-primitive-run-lifecycle.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-raw-price-run-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay raw trade starts, threshold, extension and price-break closures
        run: python -B tools/audit_chanlun_primitive_run_lifecycle.py
      - name: Reject false completed centers, retroactive event proof and invalid downstream casts
        run: python -B -m unittest discover -s tests -p "test_chanlun_primitive_run_lifecycle.py" -v
