name: chanlun-original-sina-dual-a0-source-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-role-and-completion-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -B tools/audit_chanlun_original_sina_dual_a0.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_original_sina_dual_a0.py" -v
