name: Chanlun 91–95 original PDF, four-state, Zn, trade-policy and exposure audits
on:
  push:
    branches: [feat/chanlun-lessons091-095-structure-duality-20261108]
    paths:
      - ".github/workflows/chanlun-lessons091-095-audit.yml"
      - "catalog/chanlun_lessons091_095_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons091_095_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons091_095.py"
      - "tools/audit_chanlun_lesson091_four_state_fsm.py"
      - "tools/audit_chanlun_lesson092_midpoint_monitor.py"
      - "tools/audit_chanlun_lessons093_094_policy_fills.py"
      - "tools/audit_chanlun_lesson095_remaining_exposure.py"
      - "tests/test_chanlun_lessons091_095.py"
      - "tests/test_chanlun_lesson091_four_state_fsm.py"
      - "tests/test_chanlun_lesson092_midpoint_monitor.py"
      - "tests/test_chanlun_lessons093_094_policy_fills.py"
      - "tests/test_chanlun_lesson095_remaining_exposure.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_091_095_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons091_095.py
      - run: python -B tools/audit_chanlun_lesson091_four_state_fsm.py
      - run: python -B tools/audit_chanlun_lesson092_midpoint_monitor.py
      - run: python -B tools/audit_chanlun_lessons093_094_policy_fills.py
      - run: python -B tools/audit_chanlun_lesson095_remaining_exposure.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons091_095.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson091_four_state_fsm.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson092_midpoint_monitor.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons093_094_policy_fills.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson095_remaining_exposure.py" -v
