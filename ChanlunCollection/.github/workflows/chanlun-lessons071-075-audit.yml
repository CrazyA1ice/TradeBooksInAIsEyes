name: Chanlun lessons 71–75 PDF source, revision and risk-boundary audits
on:
  push:
    branches: [feat/chanlun-lessons071-075-source-versions-20261107]
    paths:
      - ".github/workflows/chanlun-lessons071-075-audit.yml"
      - "catalog/chanlun_lessons071_075_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons071_075_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons071_075.py"
      - "tools/audit_chanlun_lesson071_typed_membership.py"
      - "tools/audit_chanlun_lessons073_074_exposure.py"
      - "tools/audit_chanlun_lessons072_075_attribution.py"
      - "tests/test_chanlun_lessons071_075.py"
      - "tests/test_chanlun_lesson071_typed_membership.py"
      - "tests/test_chanlun_lessons073_074_exposure.py"
      - "tests/test_chanlun_lessons072_075_attribution.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_071_075_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons071_075.py
      - run: python -B tools/audit_chanlun_lesson071_typed_membership.py
      - run: python -B tools/audit_chanlun_lessons073_074_exposure.py
      - run: python -B tools/audit_chanlun_lessons072_075_attribution.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons071_075.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson071_typed_membership.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons073_074_exposure.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons072_075_attribution.py" -v
