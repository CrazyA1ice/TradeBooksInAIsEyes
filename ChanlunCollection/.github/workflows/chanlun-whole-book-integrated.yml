name: Chanlun 108-lesson unified continuous reading source coverage
on:
  pull_request:
    branches: [main]
    paths:
      - "deliverables/chanlun_108_acceptance/00_REVIEW/WHOLE_BOOK_*"
      - "tools/audit_chanlun_whole_book_integrated.py"
      - "tools/audit_chanlun_fullbook_logical_spine.py"
      - "tools/audit_chanlun_f01_f02_third_point_boundary.py"
      - "tools/audit_chanlun_f01_typed_completion_obligations.py"
      - "tools/audit_chanlun_f01_segment_termination_reconciliation.py"
      - "tools/audit_chanlun_f01_original_figure_provenance.py"
      - "tests/test_chanlun_f01_original_figure_provenance.py"
      - "catalog/chanlun_f01_source_figure_review_v1.json"
      - "tests/test_chanlun_f01_segment_termination_reconciliation.py"
      - "tests/fixtures/chanlun_f01_segment_termination_cases_v1.json"
      - "catalog/chanlun_f01_segment_termination_reconciliation_v1.json"
      - "tests/test_chanlun_f01_typed_completion_obligations.py"
      - "catalog/chanlun_f01_typed_completion_obligations_v1.json"
      - "tests/test_chanlun_f01_f02_third_point_boundary.py"
      - "catalog/chanlun_f01_f02_third_point_boundary_v1.json"
      - "tests/fixtures/chanlun_f01_f02_boundary_cases_v1.json"
      - "tests/test_chanlun_fullbook_logical_spine.py"
      - "catalog/chanlun_108_fullbook_logical_spine_v1.json"
      - "tools/audit_chanlun_theory_second_pass.py"
      - "tests/test_chanlun_deep_theory_second_pass.py"
      - "catalog/chanlun_theory_argument_links_v1.json"
      - "catalog/chanlun_crosslesson_consistency_v1.json"
      - "tools/audit_chanlun_crosslesson_consistency.py"
      - "tests/test_chanlun_crosslesson_consistency.py"
      - "tests/test_chanlun_whole_book_integrated.py"
      - ".github/workflows/chanlun-whole-book-integrated.yml"
      - "catalog/chanlun_lesson_index.json"
      - "knowledge/evidence/chanlun_lesson*.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-108-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute 108 original SOURCE cards and verify exact committed atlas bytes
        run: python -B tools/audit_chanlun_whole_book_integrated.py --check-atlas
      - name: Validate cross-lesson argument source cards, proof roles, and manuscript
        run: python -B -m unittest discover -s tests -p "test_chanlun_deep_theory_second_pass.py" -v
      - name: Audit source-scoped 16 theory consistency tensions without claiming whole-book proof
        run: python -B tools/audit_chanlun_crosslesson_consistency.py
      - name: Test typed source/versions and 13 abstract countermodels
        run: python -B -m unittest discover -s tests -p "test_chanlun_crosslesson_consistency.py" -v
      - name: Check exact 108-lesson logical atlas and eight unproven theory frontiers
        run: python -B tools/audit_chanlun_fullbook_logical_spine.py --check-atlas
      - name: Preserve all source and conceptual graph constraints
        run: python -B -m unittest discover -s tests -p 'test_chanlun_fullbook_logical_spine.py' -v
      - name: Audit lesson18/20/35 author source boundary vs strict nonreturn and as-of
        run: python -B tools/audit_chanlun_f01_f02_third_point_boundary.py
      - name: Preserve inclusive boundary, source pins and no unearned center certification
        run: python -B -m unittest discover -s tests -p 'test_chanlun_f01_f02_third_point_boundary.py' -v
      - name: Validate 13 source anchors, typed pen-segment-trend completion obligations and proof blocks
        run: python -B tools/audit_chanlun_f01_typed_completion_obligations.py
      - name: Check no falsely certified child trajectories or future-only source data
        run: python -B -m unittest discover -s tests -p 'test_chanlun_f01_typed_completion_obligations.py' -v
      - name: Audit source 67/71/72/78 double-branch segment termination provenance and still-open F01 bridges
        run: python -B tools/audit_chanlun_f01_segment_termination_reconciliation.py
      - name: Check typed membership, as-of opposite fractal, legal reverse and author-source scope
        run: python -B -m unittest discover -s tests -p 'test_chanlun_f01_segment_termination_reconciliation.py' -v
      - name: Verify 18 actually viewed original PDF figure page records and correction chains
        run: python -B tools/audit_chanlun_f01_original_figure_provenance.py
      - name: Assert correction/date/confirmed-B source claims preserve all open theoretical gaps
        run: python -B -m unittest discover -s tests -p 'test_chanlun_f01_original_figure_provenance.py' -v
      - name: Verify all 108 original-source record links and integrated manuscript
        run: python -B -m unittest discover -s tests -p "test_chanlun_whole_book_integrated.py" -v
