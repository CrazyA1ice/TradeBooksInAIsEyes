name: Chanlun 81–85 original source, pen version, recursion and legal-evidence audits
on:
  push:
    branches: [feat/chanlun-lessons081-085-source-and-version-20261108]
    paths:
      - ".github/workflows/chanlun-lessons081-085-audit.yml"
      - "catalog/chanlun_lessons081_085_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons081_085_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons081_085.py"
      - "tools/audit_chanlun_lesson081_pen_rule_versions.py"
      - "tools/audit_chanlun_lesson082_fractal_outcome.py"
      - "tools/audit_chanlun_lessons083_084_recursion_noise.py"
      - "tools/audit_chanlun_lesson085_provenance_roles.py"
      - "tests/test_chanlun_lessons081_085.py"
      - "tests/test_chanlun_lesson081_pen_rule_versions.py"
      - "tests/test_chanlun_lesson082_fractal_outcome.py"
      - "tests/test_chanlun_lessons083_084_recursion_noise.py"
      - "tests/test_chanlun_lesson085_provenance_roles.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_081_085_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons081_085.py
      - run: python -B tools/audit_chanlun_lesson081_pen_rule_versions.py
      - run: python -B tools/audit_chanlun_lesson082_fractal_outcome.py
      - run: python -B tools/audit_chanlun_lessons083_084_recursion_noise.py
      - run: python -B tools/audit_chanlun_lesson085_provenance_roles.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons081_085.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson081_pen_rule_versions.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson082_fractal_outcome.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons083_084_recursion_noise.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson085_provenance_roles.py" -v
