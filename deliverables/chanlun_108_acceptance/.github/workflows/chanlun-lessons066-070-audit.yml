name: Chanlun 66–70 cross-volume source and feature-sequence audits
on:
  push:
    branches: [feat/chanlun-lessons066-070-crossvolume-20261107]
    paths:
      - ".github/workflows/chanlun-lessons066-070-audit.yml"
      - "catalog/chanlun_lessons066_070_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons066_070_crossvolume_dependencies.json"
      - "tools/verify_chanlun_lessons066_070.py"
      - "tools/audit_chanlun_lesson067_feature_gap.py"
      - "tools/audit_chanlun_lesson068_boundary_policy.py"
      - "tools/audit_chanlun_lessons069_070_events.py"
      - "tests/test_chanlun_lessons066_070.py"
      - "tests/test_chanlun_lesson067_feature_gap.py"
      - "tests/test_chanlun_lesson068_boundary_policy.py"
      - "tests/test_chanlun_lessons069_070_events.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_066_070_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons066_070.py
      - run: python -B tools/audit_chanlun_lesson067_feature_gap.py
      - run: python -B tools/audit_chanlun_lesson068_boundary_policy.py
      - run: python -B tools/audit_chanlun_lessons069_070_events.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons066_070.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson067_feature_gap.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson068_boundary_policy.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons069_070_events.py" -v
