name: Chanlun 101–105 fifth-volume source, unique decomposition and evidence audits
on:
  push:
    branches: [feat/chanlun-lessons101-105-source-audit-20261108]
    paths:
      - ".github/workflows/chanlun-lessons101-105-audit.yml"
      - "catalog/chanlun_lessons101_105_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons101_105_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons101_105.py"
      - "tools/audit_chanlun_lesson101_second_buy.py"
      - "tools/audit_chanlun_lesson102_uniqueness_contract.py"
      - "tools/audit_chanlun_lesson103_macd_zero_asof.py"
      - "tools/audit_chanlun_lessons104_105_evidence.py"
      - "tests/test_chanlun_lessons101_105.py"
      - "tests/test_chanlun_lesson101_second_buy.py"
      - "tests/test_chanlun_lesson102_uniqueness_contract.py"
      - "tests/test_chanlun_lesson103_macd_zero_asof.py"
      - "tests/test_chanlun_lessons104_105_evidence.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_101_105_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons101_105.py
      - run: python -B tools/audit_chanlun_lesson101_second_buy.py
      - run: python -B tools/audit_chanlun_lesson102_uniqueness_contract.py
      - run: python -B tools/audit_chanlun_lesson103_macd_zero_asof.py
      - run: python -B tools/audit_chanlun_lessons104_105_evidence.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons101_105.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson101_second_buy.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson102_uniqueness_contract.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson103_macd_zero_asof.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons104_105_evidence.py" -v
