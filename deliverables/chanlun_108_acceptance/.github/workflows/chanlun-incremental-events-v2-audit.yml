name: Chanlun v2 append-only evidence and typed feature gates
on:
  push:
    branches: [feat/chanlun-incremental-evidence-events-segment-gates-20261108]
    paths:
      - ".github/workflows/chanlun-incremental-events-v2-audit.yml"
      - "tools/chanlun_incremental_events_v2.py"
      - "tools/audit_chanlun_incremental_witnesses_v2.py"
      - "tools/chanlun_event_lab_v1.py"
      - "tests/test_chanlun_incremental_events_v2.py"
      - "catalog/chanlun_rule_history_v1.json"
      - "experiments/fixtures/chanlun_prefix_synthetic_v1.json"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -B -m unittest discover -s tests -p "test_chanlun_incremental_events_v2.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_event_lab_v1.py" -v
      - run: python -B tools/chanlun_incremental_events_v2.py
      - run: python -B tools/chanlun_incremental_events_v2.py --rule pen_077_exposition --attested-known-at "2007-09-19T09:00:00+08:00" --proof-ref synthetic-research-availability
      - run: python -B tools/chanlun_incremental_events_v2.py --rule pen_081_later_dated_post --attested-known-at "2007-09-19T09:00:00+08:00" --proof-ref synthetic-research-availability
      - run: python -B tools/audit_chanlun_incremental_witnesses_v2.py
      - run: python -B tools/audit_chanlun_unified_knowledge.py --verify
