name: Chanlun 86–90 two-volume source, transition, high-level context and BOLL audits
on:
  push:
    branches: [feat/chanlun-lessons086-090-crossvolume-20261108]
    paths:
      - ".github/workflows/chanlun-lessons086-090-audit.yml"
      - "catalog/chanlun_lessons086_090_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons086_090_crossvolume_dependencies.json"
      - "tools/verify_chanlun_lessons086_090.py"
      - "tools/audit_chanlun_lesson086_crosslevel_context.py"
      - "tools/audit_chanlun_lessons088_089_transition_center.py"
      - "tools/audit_chanlun_lesson090_boll_asof.py"
      - "tests/test_chanlun_lessons086_090.py"
      - "tests/test_chanlun_lesson086_crosslevel_context.py"
      - "tests/test_chanlun_lessons088_089_transition_center.py"
      - "tests/test_chanlun_lesson090_boll_asof.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_086_090_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons086_090.py
      - run: python -B tools/audit_chanlun_lesson086_crosslevel_context.py
      - run: python -B tools/audit_chanlun_lessons088_089_transition_center.py
      - run: python -B tools/audit_chanlun_lesson090_boll_asof.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons086_090.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson086_crosslevel_context.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons088_089_transition_center.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson090_boll_asof.py" -v
