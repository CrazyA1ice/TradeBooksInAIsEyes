name: Chanlun lessons 6-10 research evidence and probability audit
on:
  push:
    branches: [feat/chanlun-lessons006-010-source-study-20261107]
    paths:
      - ".github/workflows/chanlun-lessons006-010-audit.yml"
      - "tools/verify_chanlun_lessons006_010.py"
      - "tools/check_chanlun_lesson009_probability.py"
      - "tests/test_chanlun_lessons006_010.py"
      - "tests/test_chanlun_lesson009_probability.py"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "catalog/chanlun_lessons006_010_layers.json"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_001_010_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify real PDF fingerprint and lesson evidence
        run: python -B tools/verify_chanlun_lessons006_010.py
      - name: Run deterministic probability demonstration
        run: python -B tools/check_chanlun_lesson009_probability.py
      - name: Run evidence and probability regression tests
        run: python -B -m unittest discover -s tests -p "test_chanlun_lessons006_010.py" -v && python -B -m unittest discover -s tests -p "test_chanlun_lesson009_probability.py" -v
