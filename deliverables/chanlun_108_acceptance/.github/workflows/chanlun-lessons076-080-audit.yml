name: Chanlun 76–80 original source, pen, normalized-view and as-of audits
on:
  push:
    branches: [feat/chanlun-lessons076-080-revisions-20261108]
    paths:
      - ".github/workflows/chanlun-lessons076-080-audit.yml"
      - "catalog/chanlun_lessons076_080_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "knowledge/claims/chanlun_lessons076_080_semantic_dependencies.json"
      - "tools/verify_chanlun_lessons076_080.py"
      - "tools/audit_chanlun_lesson077_pen_boundary.py"
      - "tools/audit_chanlun_lesson078_normalized_view.py"
      - "tools/audit_chanlun_lessons079_080_dual_clock.py"
      - "tests/test_chanlun_lessons076_080.py"
      - "tests/test_chanlun_lesson077_pen_boundary.py"
      - "tests/test_chanlun_lesson078_normalized_view.py"
      - "tests/test_chanlun_lessons079_080_dual_clock.py"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_076_080_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - run: python -B tools/verify_chanlun_lessons076_080.py
      - run: python -B tools/audit_chanlun_lesson077_pen_boundary.py
      - run: python -B tools/audit_chanlun_lesson078_normalized_view.py
      - run: python -B tools/audit_chanlun_lessons079_080_dual_clock.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons076_080.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson077_pen_boundary.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson078_normalized_view.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons079_080_dual_clock.py" -v
