name: Chanlun lessons 26–30 evidence and nested-interval audits
on:
  push:
    branches: [feat/chanlun-lessons026-030-research-20261107]
    paths:
      - ".github/workflows/chanlun-lessons026-030-audit.yml"
      - "tools/verify_chanlun_lessons026_030.py"
      - "tools/audit_chanlun_lesson027_nested_intervals.py"
      - "tests/test_chanlun_lessons026_030.py"
      - "tests/test_chanlun_lesson027_nested_intervals.py"
      - "catalog/chanlun_lessons026_030_source_layers.json"
      - "knowledge/evidence/chanlun_lesson*.json"
      - "analyses/books/chanlun/chapters/lesson_*.md"
      - "analyses/books/chanlun/volumes/LESSONS_026_030_SYNTHESIS.md"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -B tools/verify_chanlun_lessons026_030.py
      - run: python -B tools/audit_chanlun_lesson027_nested_intervals.py
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lessons026_030.py" -v
      - run: python -B -m unittest discover -s tests -p "test_chanlun_lesson027_nested_intervals.py" -v
